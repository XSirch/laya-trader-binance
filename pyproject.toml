[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "jev-binance-research"
version = "0.1.0"
description = "Reproducible Binance spot strategy research with an optional Jev decision gate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
tree-research = ["scikit-learn==1.9.1"]

[project.scripts]
jev-trader = "jev_trader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_trader"]
