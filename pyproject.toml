[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laya-trader-binance"
version = "0.1.0"
description = "Leakage-aware Binance USD-M dataset and Laya fine-tuning pipeline for typed trading decisions"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=15,<22",
  "requests>=2.32,<3",
  "safetensors>=0.4,<1",
  "scipy>=1.12,<2",
  "torch>=2.3,<3",
  "transformers>=4.48,<6",
  "huggingface-hub>=0.27,<1",
  "laya @ git+https://github.com/NandhaKishorM/laya.git@573e5b62696ba441230cd6be71d593331b5d23af",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
laya-download = "laya_trader.data.binance_public:main"
laya-build-dataset = "laya_trader.dataset.build:main"
laya-train = "laya_trader.laya.train:main"
laya-calibrate = "laya_trader.laya.calibrate:main"
laya-infer = "laya_trader.laya.infer:main"
laya-evaluate = "laya_trader.laya.evaluate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/laya_trader"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
