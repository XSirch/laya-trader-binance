[data]
market = "um"
interval = "15m"
start = "2020-01-01"
end = "2026-08-31"
raw_dir = "data/raw"
processed_dir = "data/processed"
dataset_dir = "data/dataset"
workers = 8
symbols = [
  "BTCUSDT",
  "ETHUSDT",
  "BNBUSDT",
  "XRPUSDT",
  "SOLUSDT",
  "DOGEUSDT",
  "ADAUSDT",
  "LINKUSDT",
  "AVAXUSDT",
  "DOTUSDT",
  "LTCUSDT",
  "BCHUSDT",
  "TRXUSDT",
  "ATOMUSDT",
  "NEARUSDT",
  "UNIUSDT",
  "APTUSDT",
  "ARBUSDT",
  "OPUSDT",
  "SUIUSDT",
]

[features]
warmup_bars = 250
higher_timeframes = ["1h", "4h"]
include_symbol = true

[labels]
horizon_bars = 16
take_profit_atr = 2.0
stop_loss_atr = 1.0
fee_bps_per_side = 5.0
slippage_bps_per_side = 2.0
min_edge_r = 0.10
target_temperature = 0.35
tradeable_temperature = 0.25
drop_ambiguous = true

[splits]
train_end = "2024-12-31T23:59:59Z"
calibration_end = "2025-06-30T23:59:59Z"
validation_end = "2025-12-31T23:59:59Z"
test_end = "2026-08-31T23:59:59Z"
embargo_bars = 16

[sampling]
seed = 42
max_rows_per_symbol_per_split = 5000
